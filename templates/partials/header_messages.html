<a
  class="icon-btn messages-shortcut"
  href="{{ url_for('messages_inbox') }}"
  aria-label="Messages{% if unread_messages %} ({{ unread_messages }} unread){% endif %}"
  title="Messages{% if unread_messages %} · {{ unread_messages }} unread{% endif %}"
>
  <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8l-4 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="currentColor"/>
  </svg>
  {% if unread_messages %}
    <span class="bell-dot" id="messages-unread-badge">{{ unread_messages }}</span>
  {% endif %}
</a>
